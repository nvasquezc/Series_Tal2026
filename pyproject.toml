[project]
name = "ventas-minoristas-colombia"
version = "0.1.0"
description = "Pronóstico del índice mensual de ventas reales del comercio minorista en Colombia (DANE - EMC). Proyecto del curso Series de Tiempo, Maestría en Analítica de Datos, Universidad Central."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Jhon J. Ballén", email = "jballena@ucentral.edu.co" },
    { name = "David F. Orjuela", email = "dorjuelah@ucentral.edu.co" },
    { name = "Néstor O. Vásquez", email = "nvasquezc@ucentral.edu.co" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14.2",
    "arch>=7.0",
    "prophet>=1.1.6",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "requests>=2.32",
    "kaleido>=1.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
